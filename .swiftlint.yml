included:
  - DeDuP
  - DeDuPTests

excluded:
  - dedup_grid

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - force_unwrapping
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_imports

analyzer_rules:
  - unused_import

disabled_rules:
  - todo

force_cast: error

line_length:
  warning: 130
  error: 160

# Counts code the way `type_body_length` already does. The two rules disagreed by default, so a
# file documenting *why* its concurrency looks the way it does was pushed over the limit by its
# own rationale, which is the one thing here worth keeping.
file_length:
  ignore_comment_only_lines: true

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

reporter: xcode
